name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 regression tests
        shell: powershell
        run: ./SelfTest.ps1
      - name: PowerShell 7 regression tests
        shell: pwsh
        run: ./SelfTest.ps1
      - name: Build allowlisted release
        shell: powershell
        run: ./Build-Release.ps1
      - name: Scan source and release for private data
        run: python tools/check_public_content.py --archive dist/CodexProxyGuardian-v2.0.0.zip
